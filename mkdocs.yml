site_name: Opus Zero
site_description: Sổ tay học piano cổ điển từ con số 0 đến nâng cao — kỹ thuật, tác phẩm, nhạc lý, luyện tai, lịch sử và nghe nhạc, với công cụ luyện tập ngay trong trình duyệt.
site_author: mtuann
site_url: https://mtuann.github.io/opus-zero/
repo_url: https://github.com/mtuann/opus-zero
repo_name: mtuann/opus-zero
edit_uri: edit/main/docs/
copyright: Opus Zero — sổ tay học piano cổ điển của mtuann

theme:
  name: material
  custom_dir: overrides
  language: vi
  font:
    text: Be Vietnam Pro
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng
  icon:
    logo: material/music-clef-treble
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.prune
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

hooks:
  - hooks/search_vi.py
  - hooks/books.py
  - hooks/a11y.py
  - hooks/redirects.py
  - hooks/meta.py

plugins:
  - search:
      lang:
        - en
        - vi
      # Không lọc từ dừng tiếng Anh: "am", "not", "do" là từ tiếng Việt khi gõ không dấu.
      pipeline: []
      separator: '[\s\-,:;!?.()\[\]"“”/…]+'
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive_name: Lưu trữ
      categories_name: Chủ đề

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: abc
          class: abc-notation
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: quiz
          class: oz-quiz
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: placement
          class: oz-placement
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/css/vendor/abcjs-audio.css
  - assets/css/opus.css

extra_javascript:
  - assets/js/loader.js
  - assets/js/audio.js
  - assets/js/progress.js
  - assets/js/print.js
  - assets/js/pwa.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mtuann

