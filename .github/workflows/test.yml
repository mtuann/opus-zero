name: Kiểm thử

# Chạy cho mọi nhánh khác main, mọi pull request, khi bấm chạy tay,
# và được deploy.yml gọi trước mỗi lần deploy (nên main cũng luôn được kiểm thử).
# Kiểm thử chia thành các nhóm (xem tests/run.mjs), mỗi nhóm một job chạy song song.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Kiểm thử (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      # Một nhóm lỗi vẫn để các nhóm khác chạy xong, để thấy hết lỗi trong một lần.
      fail-fast: false
      matrix:
        group: [nhanh, trang-1, trang-2, a11y]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test -- ${{ matrix.group }}
