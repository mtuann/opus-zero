name: Chuẩn bị môi trường kiểm thử
description: Cài Python và MkDocs, build site (kiểm tra chặt), cài Node và các gói kiểm thử.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - run: pip install -r requirements.txt
      shell: bash
    - run: mkdocs build --strict
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
    - run: npm ci
      shell: bash
